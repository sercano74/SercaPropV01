{% extends "base.html" %}
{% block content %}
<div class="form-modern-container">
    <h2>🔗 Asignar Corredor</h2>
    <p style="color:var(--ds-text-secondary);margin-bottom:16px;">Propiedad: <strong>{{ propiedad.get_tipo_prop_display }} - {{ propiedad.calle }} #{{ propiedad.numero_calle }}</strong></p>
    <form method="POST" class="form-modern">
        {% csrf_token %}
        <div class="form-group">
            <label>Responsable (corredor, gerente o superadmin)</label>
            <select name="corredor_id" required>
                <option value="">Seleccionar responsable...</option>
                {% for c in corredores %}
                <option value="{{ c.id }}">{{ c.get_full_name|default:c.username }} ({{ c.email }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Tipo de comisión</label>
                <select name="tipo_comision">
                    <option value="porcentaje">Porcentaje</option>
                    <option value="fijo">Monto Fijo</option>
                </select>
            </div>
            <div class="form-group">
                <label>Comisión (usuario)</label>
                <input type="number" name="monto_comision_usu" step="0.01">
            </div>
        </div>
        <div class="form-group">
            <label>Comisión (dueño)</label>
            <input type="number" name="monto_comision_dueno" step="0.01">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Asignar corredor</button>
    </form>
</div>
{% endblock %}
