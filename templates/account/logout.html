{% extends "base.html" %}
{% block content %}
<div class="form-modern-container" style="max-width:400px;text-align:center;">
    <h2>👋 Cerrar Sesión</h2>
    <p style="color:var(--ds-text-secondary);margin:16px 0;">¿Estás seguro de que deseas cerrar tu sesión?</p>

    <form method="POST" action="{% url 'account_logout' %}">
        {% csrf_token %}
        {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
        {% endif %}
        <div style="display:flex;gap:12px;justify-content:center;">
            <button type="submit" class="btn btn-primary">Sí, cerrar sesión</button>
            <a href="{% url 'home' %}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
</write_to_file>
