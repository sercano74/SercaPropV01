{% extends "base.html" %}
{% block title %}Página no encontrada{% endblock %}
{% block content %}
<div style="text-align:center;padding:80px 20px;max-width:600px;margin:0 auto;">
    <div style="font-size:5rem;margin-bottom:16px;">🔍</div>
    <h1 style="font-size:1.8rem;margin-bottom:12px;">Página no encontrada</h1>
    <p style="color:var(--ds-text-secondary);font-size:1rem;margin-bottom:24px;">
        La página o el recurso que buscas no existe, fue removido o no tienes acceso a él.
    </p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <a href="/" class="btn btn-primary"><img src="{% static 'images/logo-serca.svg' %}" alt="Serca Propiedades" style="height:1em;vertical-align:-0.2em;"> Ir al inicio</a>
        <a href="/prop" class="btn btn-outline">🏘️ Ver propiedades</a>
    </div>
</div>
{% endblock %}
