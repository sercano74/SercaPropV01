{% extends "base.html" %}
{% block content %}
<div class="form-modern-container">
    <h2>📝 Crear Cuenta</h2>
    <form method="POST" class="form-modern">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label>Nombres</label>
                <input type="text" name="first_name" placeholder="Juan">
            </div>
            <div class="form-group">
                <label>Apellidos</label>
                <input type="text" name="last_name" placeholder="Pérez">
            </div>
        </div>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" name="email" required placeholder="tu@email.cl">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Contraseña *</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>Repetir contraseña *</label>
                <input type="password" name="password2" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>RUT / DNI</label>
                <input type="text" name="dni" placeholder="12.345.678-9">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" name="cel_phone" placeholder="+56 9 1234 5678">
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Crear Cuenta</button>
        <p style="margin-top:16px;text-align:center;font-size:0.9rem;color:var(--ds-text-secondary);">
            ¿Ya tienes cuenta? <a href="{% url 'login' %}" style="color:var(--ds-primary);font-weight:600;text-decoration:underline;">Inicia sesión</a>
        </p>
    </form>
</div>
{% endblock %}
